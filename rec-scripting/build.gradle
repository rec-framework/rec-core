plugins {
    id 'java'
    id 'org.graalvm.buildtools.native' version '0.10.6'
}

dependencies {
    implementation project(':rec-core')
    implementation "org.mozilla:rhino:1.7.7.1"
    implementation "org.slf4j:slf4j-api:2.0.17"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.17"
    runtimeOnly project(':rec-cache')
    runtimeOnly project(':rec-jdbi')
    runtimeOnly project(':rec-reactive')
    runtimeOnly project(':rec-datatype-jsonl')
    runtimeOnly project(':rec-datatype-parquet')
    runtimeOnly project(':rec-agent')
}

task mergeServiceFiles {
    def outputDir = file("${buildDir}/merged-services")
    inputs.files configurations.runtimeClasspath
    outputs.dir outputDir
    doLast {
        def serviceFiles = [:] as LinkedHashMap<String, LinkedHashSet<String>>
        configurations.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }.each { jarFile ->
            java.util.zip.ZipFile zip = new java.util.zip.ZipFile(jarFile)
            zip.entries().each { entry ->
                if (entry.name.startsWith('META-INF/services/') && !entry.isDirectory()) {
                    def key = entry.name
                    if (!serviceFiles.containsKey(key)) {
                        serviceFiles[key] = new LinkedHashSet<String>()
                    }
                    serviceFiles[key].addAll(zip.getInputStream(entry).text.readLines().findAll { it.trim() })
                }
            }
            zip.close()
        }
        serviceFiles.each { name, lines ->
            def outputFile = new File(outputDir, name)
            outputFile.parentFile.mkdirs()
            outputFile.text = lines.join('\n') + '\n'
        }
    }
}

task fatJar(type: Jar, dependsOn: mergeServiceFiles) {
    zip64 = true
    manifest {
        attributes 'Implementation-Title': 'Rec v2',
                'Implementation-Version': version,
                'Main-Class': 'net.kimleo.rec.App'
    }
    archiveBaseName = 'rec-core'
    archiveClassifier = 'all'
    from {
        configurations.runtimeClasspath.collect {
            zipTree(it).matching {
                exclude 'META-INF/services/**'
                exclude 'META-INF/*.SF'
                exclude 'META-INF/*.DSA'
                exclude 'META-INF/*.RSA'
            }
        }
    }
    from("${buildDir}/merged-services") {
        include 'META-INF/services/*'
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// --- GraalVM Native Image Configuration ---

graalvmNative {
    binaries {
        main {
            imageName = 'rec'
            mainClass = 'net.kimleo.rec.App'
            buildArgs.addAll([
                '--no-fallback',
                '--enable-http',
                '--enable-https',
                '-H:+ReportExceptionStackTraces',
                '--initialize-at-build-time=org.slf4j',
                '--initialize-at-build-time=org.slf4j.simple',
                '--initialize-at-build-time=org.mozilla.javascript',
                '--initialize-at-run-time=okhttp3',
                '--initialize-at-run-time=org.jline',
                '--initialize-at-run-time=org.apache.hadoop',
                '--initialize-at-run-time=org.apache.parquet',
                '--initialize-at-run-time=io.netty',
                '--enable-all-security-services',
                '--install-exit-handlers',
            ])
            configurationFileDirectories.from(
                file('src/main/resources/META-INF/native-image')
            )
        }
    }
    metadataRepository {
        enabled = true
    }
}

// --- Tracing Agent Tasks ---

def agentOutputDir = file("${buildDir}/native-agent-output")

task agentRun(type: JavaExec, dependsOn: 'fatJar') {
    description = 'Run the fat JAR with the GraalVM tracing agent to capture metadata'
    group = 'native'

    def graalHome = System.getenv('JAVA_HOME')
    if (graalHome) {
        executable = "${graalHome}/bin/java"
    }

    doFirst {
        agentOutputDir.mkdirs()
    }

    jvmArgs = [
        "-agentlib:native-image-agent=config-output-dir=${agentOutputDir}"
    ]

    classpath = files(fatJar.archiveFile)
    mainClass = 'net.kimleo.rec.App'

    args = project.hasProperty('agentArgs')
        ? project.property('agentArgs').toString().split(' ')
        : ['--help']
}

task agentRunInteractive(type: JavaExec, dependsOn: 'fatJar') {
    description = 'Run the agent TUI with tracing agent (interactive mode)'
    group = 'native'

    def graalHome = System.getenv('JAVA_HOME')
    if (graalHome) {
        executable = "${graalHome}/bin/java"
    }

    doFirst {
        agentOutputDir.mkdirs()
    }

    jvmArgs = [
        "-agentlib:native-image-agent=config-output-dir=${agentOutputDir}"
    ]

    classpath = files(fatJar.archiveFile)
    mainClass = 'net.kimleo.rec.App'
    args = ['--agent']
    standardInput = System.in
}

task copyAgentConfig(type: Copy) {
    description = 'Copy agent-generated configs into the source tree for version control'
    group = 'native'

    from agentOutputDir
    into 'src/main/resources/META-INF/native-image'
}
